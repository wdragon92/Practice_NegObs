# placement_rules_v1.yaml — the rule table `scripts/placement_lint.py` executes.
#
# Wave W3 · WP T1 · owner: T1 (this file and scripts/placement_lint.py are T1's ONLY writes).
# Authority: Docs/briefs/w3_execution_spec_v1.md — §10.3 (PROP_EDGE), §10.4 (LINT-1..LINT-10),
#            §1.2 (jitter), §1.3 (species), §1.8 (evidence-gap: prepare vs enforce), §12 (do-not-touch).
#
# Every number carries an evidence tag:
#   [law]        statute / notice / enforcement-rule figure, cited in `basis`
#   [derived]    computed from a [law] figure, derivation stated
#   [measured]   measured in this repo, instrument named
#   [ruled]      supervisor ruling relayed by the spec, section cited
#   [convention] a linter implementation constant with no external authority; it decides
#                classification or tolerance only, never a pass/fail threshold on a real dimension
#
# Editing contract: thresholds move only when the spec moves. If a rule's datum does not exist
# yet, it stays under `gates:` with `mode: warn` and a `blocked_on:` — it is NOT deleted and it is
# NOT quietly enforced (spec §1.8: "prepare" = check in warn mode, "enforce" = flip to hard).

